# Local development stack for the Online Shop Microservices platform.
#
# Week 2 scope: User Service and Product Service, each with its own database.
# Later weeks add the Order, Payment and Notification services, the message broker,
# the API Gateway and the monitoring stack.
#
#   docker compose up --build
#   User Service     http://localhost:8000/docs
#   Product Service  http://localhost:8081/swagger-ui.html

services:
  # --- Databases -------------------------------------------------------------
  # Database-per-service: two separate Postgres instances, not two schemas in one.
  # Sharing a database would couple the services at their most brittle layer.

  user-db:
    image: postgres:16-alpine
    container_name: user-db
    environment:
      POSTGRES_USER: user_service
      POSTGRES_PASSWORD: user_service
      POSTGRES_DB: user_db
    ports:
      - "5432:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_service -d user_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shop

  product-db:
    image: postgres:16-alpine
    container_name: product-db
    environment:
      POSTGRES_USER: product_service
      POSTGRES_PASSWORD: product_service
      POSTGRES_DB: product_db
    ports:
      # Second database on a different host port so both can be reached from the host.
      - "5433:5432"
    volumes:
      - product-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U product_service -d product_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shop

  # --- Services --------------------------------------------------------------

  user-service:
    build:
      context: ./services/user-service
    container_name: user-service
    environment:
      USER_SERVICE_ENVIRONMENT: docker
      USER_SERVICE_DATABASE_URL: postgresql+psycopg://user_service:user_service@user-db:5432/user_db
      USER_SERVICE_CREATE_TABLES_ON_STARTUP: "true"
      USER_SERVICE_LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      user-db:
        # Wait for the database to accept connections, not merely to start.
        condition: service_healthy
    networks:
      - shop

  product-service:
    build:
      context: ./services/product-service
    container_name: product-service
    environment:
      PRODUCT_SERVICE_DATASOURCE_URL: jdbc:postgresql://product-db:5432/product_db
      PRODUCT_SERVICE_DATASOURCE_USERNAME: product_service
      PRODUCT_SERVICE_DATASOURCE_PASSWORD: product_service
      PRODUCT_SERVICE_PORT: "8081"
      PRODUCT_SERVICE_LOG_LEVEL: INFO
    ports:
      - "8081:8081"
    depends_on:
      product-db:
        condition: service_healthy
    networks:
      - shop

volumes:
  user-db-data:
  product-db-data:

networks:
  shop:
    driver: bridge
