spring:
  application:
    name: product-service
  datasource:
    # Every value has a container-friendly default and an environment override.
    url: ${PRODUCT_SERVICE_DATASOURCE_URL:jdbc:postgresql://localhost:5433/product_db}
    username: ${PRODUCT_SERVICE_DATASOURCE_USERNAME:product_service}
    password: ${PRODUCT_SERVICE_DATASOURCE_PASSWORD:product_service}
  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate must never alter it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PRODUCT_SERVICE_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        # Prometheus scrapes /actuator/prometheus once the monitoring stack lands in week 10.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        # Exposes /actuator/health/liveness and /readiness for Kubernetes.
        enabled: true
      show-details: when_authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: ${PRODUCT_SERVICE_LOG_LEVEL:INFO}
