spring:
  datasource:
    url: jdbc:h2:mem:notification_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      # Flyway's Postgres migrations do not run on H2, so the test schema comes from JPA.
      ddl-auto: create-drop
  flyway:
    enabled: false
  kafka:
    listener:
      # No broker in most tests: they call the listener directly. The embedded-broker test
      # turns this back on.
      auto-startup: false

notification:
  kafka:
    retry-backoff-ms: 100
  scheduling:
    # The retry job and the pruner are called directly by tests, not by a timer.
    enabled: false
