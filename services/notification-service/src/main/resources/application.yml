spring:
  application:
    name: notification-service
  datasource:
    # Every value has a container-friendly default and an environment override.
    url: ${NOTIFICATION_SERVICE_DATASOURCE_URL:jdbc:postgresql://localhost:5436/notification_db}
    username: ${NOTIFICATION_SERVICE_DATASOURCE_USERNAME:notification_service}
    password: ${NOTIFICATION_SERVICE_DATASOURCE_PASSWORD:notification_service}
  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate must never alter it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${NOTIFICATION_SERVICE_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      # The offset is committed by the container after the listener returns, i.e. after
      # the database transaction has committed. At-least-once, never at-most-once.
      enable-auto-commit: false
      # Plain strings: the listener parses JSON itself so the event model stays ours.
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      # Only used to forward poison messages to <topic>.dlq, byte for byte.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    listener:
      ack-mode: record

server:
  port: ${NOTIFICATION_SERVICE_PORT:8084}

notification:
  # "logging" writes a line per message and delivers nothing. It is the only sender that
  # exists; a real provider is a new NotificationSender implementation.
  sender: ${NOTIFICATION_SERVICE_SENDER:logging}
  topics:
    orders: ${NOTIFICATION_SERVICE_KAFKA_ORDERS_TOPIC:orders}
    payments: ${NOTIFICATION_SERVICE_KAFKA_PAYMENTS_TOPIC:payments}
  kafka:
    # Pause between the three attempts at a failing message before it is dead-lettered.
    retry-backoff-ms: ${NOTIFICATION_SERVICE_KAFKA_RETRY_BACKOFF_MS:1000}
  retry:
    interval-ms: ${NOTIFICATION_SERVICE_RETRY_INTERVAL_MS:60000}
    max-attempts: ${NOTIFICATION_SERVICE_MAX_SEND_ATTEMPTS:5}
    # A PENDING row this old was orphaned by a crash between recording and sending.
    stale-pending-after: ${NOTIFICATION_SERVICE_STALE_PENDING_AFTER:PT5M}
  processed-events:
    # Topic retention (7 days) plus a day's margin.
    retention: ${NOTIFICATION_SERVICE_PROCESSED_EVENTS_RETENTION:P8D}
    prune-cron: "0 0 * * * *"
  scheduling:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        # Prometheus scrapes /actuator/prometheus once the monitoring stack lands in week 10.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        # Exposes /actuator/health/liveness and /readiness for Kubernetes.
        enabled: true
      show-details: when_authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: ${NOTIFICATION_SERVICE_LOG_LEVEL:INFO}
